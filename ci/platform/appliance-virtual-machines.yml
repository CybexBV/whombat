# The appliance's NixOS VM tests (appliance/), run by the maintainers' own CI on request:
# `ci-platform run whombat-runtime --job virtual-machines --revision <commit>`. Every step runs in appliance/. Like
# `nix` in appliance.yml, it needs the flake in appliance/ to read Whombat and the hosts service from this commit.
name: appliance-virtual-machines
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: appliance-virtual-machines-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  TMPDIR: /var/tmp/whombat-ci
jobs:
  qualification:
    runs-on: [self-hosted, linux, x64, whombat, whombat-appliance]
    timeout-minutes: 240
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise runtime, recovery and isolation in KVM
        run: bash scripts/ci/virtual-machines.sh 2>&1 | tee "$RUNNER_TEMP/virtual-machines.log"
      - name: Keep VM diagnostics locally
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/virtual-machines.log" ]; then
            /opt/whombat-ci/bin/artifact save vm-log "$RUNNER_TEMP/virtual-machines.log"
          fi
          if [ -d "$RUNNER_TEMP/vm-results" ]; then
            /opt/whombat-ci/bin/artifact save vm-results "$RUNNER_TEMP/vm-results"
          fi
