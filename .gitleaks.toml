[[allowlists]]
description = "Minified third-party code in a patch (xterm.js), not secrets"
paths = ['''^patches/@xterm__xterm@6\.0\.0\.patch$''']

[[allowlists]]
description = "Type names, not key material"
regexes = ['''^Ed25519PrivateKey$''']

[[allowlists]]
description = "Public values that look like keys: the Android app's signing-certificate hash (Digital Asset Links publish it) and an image name pattern in a design brief"
regexTarget = "line"
regexes = [
  '''android:apk-key-hash:[A-Za-z0-9_-]{43}''',
  '''png/<key>-bust-512\.png''',
]

# >>> appliance/ and hosts/: written by scripts/ci/scanner_allowlists.py from the folders’ own lists
[[allowlists]]
description = "appliance/: The contracts' conformance vectors (vendored, the same files the Whombat repository allowlists) and the vendored contracts release tarballs that carry them: development keys derived from public seeds, dummy secrets"
paths = [
  '''^appliance/harness/vendor/whombat-contracts/4\.11\.0/whombat-contracts-(go|schema)-4\.11\.0\.tar\.gz$''',
]

[[allowlists]]
description = "appliance/: Reviewed tests: made-up tokens, a made-up commit id and a key file's name"
paths = [
  '''^appliance/backup/internal/quarantine/undo_test\.go$''',
  '''^appliance/console/internal/web/web_test\.go$''',
  '''^appliance/harness/src/dev/candidate-plan\.test\.ts$''',
]

[[allowlists]]
description = "appliance/: Reviewed: a Go type alias in tufrepo's channel commands (`type devtufKey = ed25519.PrivateKey`) that the generic-api-key rule reads as a key; it holds no value"
condition = "AND"
regexTarget = "match"
regexes = ['''^devtufKey = ed25519\.PrivateKey$''']
paths = ['''^appliance/''']

[[allowlists]]
description = "hosts/: Reviewed docs and fixtures: a made-up temporary password in an API example, container image names"
paths = [
  '''^hosts/docs/REST-API\.md$''',
  '''^hosts/internal/hub/fakefleet/hosts\.go$''',
]

[[allowlists]]
description = "hosts/: Public values, not secrets: the fingerprint of Anthropic's published Claude Code release signing key"
condition = "AND"
regexes = ['''^31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE$''']
paths = ['''^hosts/''']
# <<< appliance/ and hosts/
