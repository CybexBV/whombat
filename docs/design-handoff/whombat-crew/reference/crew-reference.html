<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whombat crew reference</title>
<style>
  :root { --paper: #f3ede3; --ink: #2b221d; --muted: #6d5b50; --dark: #2b221d; --dark-muted: #cbb8a4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  section { padding: 32px 40px; }
  section.dark { background: var(--dark); color: #f3ede3; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
  .dark h2 { color: var(--dark-muted); }
  .roster { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card b { font-size: 22px; margin-top: 6px; }
  .card span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  .sizes { display: grid; grid-template-columns: 120px repeat(6, auto); gap: 12px 28px; align-items: end; justify-content: start; }
  .sizes .label { align-self: center; font-weight: 600; }
  .sizes .h { font-size: 11px; color: var(--muted); align-self: end; }
  .dark .sizes .h { color: var(--dark-muted); }
  .expr { display: grid; grid-template-columns: 110px repeat(10, 112px); gap: 6px; align-items: center; }
  .expr .h { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
  img { display: block; }
</style>
</head>
<body>
<section>
  <h1>The Whombat crew</h1>
  <h2>Static SVG avatars · bust ≥ 40 px · head 25–39 px · head-small ≤ 24 px</h2>
  <div class="roster" id="roster"></div>
</section>
<section>
  <h2>Sizes on light · 160 · 64 · 40 (bust) · 32 (head) · 24 · 16 (head-small)</h2>
  <div class="sizes" id="sizes-light"></div>
</section>
<section class="dark">
  <h2>Sizes on dark</h2>
  <div class="sizes" id="sizes-dark"></div>
</section>
<section>
  <h2>Expressions (delivered for later; not wired in this change)</h2>
  <div class="expr" id="expr"></div>
</section>
<script>
  const CREW = [
    { key: 'associate', name: 'Dusty', role: 'Associate', deep: '#6a5aa3' },
    { key: 'developer', name: 'Banjo', role: 'Software Developer', deep: '#3e7b58' },
    { key: 'operator', name: 'Neo', role: 'Operator', deep: '#8d6d2d' },
    { key: 'lead', name: 'Skipper', role: 'Lead', deep: '#a33346' },
    { key: 'assistant', name: 'Hazel', role: 'Assistant', deep: '#74792a' },
  ];
  const EXPR = ['neutral', 'happy', 'listening', 'thinking', 'working', 'surprised', 'confused', 'apologetic', 'sleepy', 'celebrate'];
  const file = (key, size) => `../svg/${key}-${size >= 40 ? 'bust' : size >= 25 ? 'head' : 'head-small'}.svg`;
  const img = (src, size, alt = '') => `<img src="${src}" width="${size}" height="${size}" alt="${alt}">`;
  document.getElementById('roster').innerHTML = CREW.map((c) =>
    `<div class="card">${img(file(c.key, 160), 160, `${c.name}, ${c.role}`)}<b>${c.name}</b><span style="color:${c.deep}">${c.role}</span></div>`).join('');
  for (const id of ['sizes-light', 'sizes-dark']) {
    document.getElementById(id).innerHTML = '<div></div>' + [160, 64, 40, 32, 24, 16].map((s) => `<div class="h">${s}</div>`).join('') +
      CREW.map((c) => `<div class="label">${c.name}</div>` + [160, 64, 40, 32, 24, 16].map((s) => img(file(c.key, s), s)).join('')).join('');
  }
  document.getElementById('expr').innerHTML = '<div></div>' + EXPR.map((e) => `<div class="h">${e}</div>`).join('') +
    CREW.map((c) => `<div style="font-weight:600">${c.name}</div>` + EXPR.map((e) => img(`../expressions/svg/${c.key}-${e}.svg`, 112, `${c.name}, ${e}`)).join('')).join('');
</script>
</body>
</html>
