    const nod = gt < 1.8 ? Math.exp(-gt * 3.2) * Math.sin(gt * Math.PI * 2 * 1.3) : 0;
    const flash = gt < 0.7 ? Math.sin(Math.PI * gt / 0.7) : 0;

    const b = (1 - Math.cos(2 * Math.PI * t / m.P + m.ph)) / 2;
    const sw = 0.6 * Math.sin(2 * Math.PI * t / 7.3 + m.s1) + 0.4 * Math.sin(2 * Math.PI * t / 11.9 + m.s2);
    const f = n => n.toFixed(3);

    if (E.body) E.body.style.transform = `translateY(${f(-0.45 * b * I - 0.25 * al)}cqw) scale(${f(1 + 0.004 * b * I)}, ${f(1 + 0.012 * b * I + 0.006 * al)})`;
    if (E.head) E.head.style.transform = `translate(${f(0.35 * sw * I + 0.6 * m.hg.x * I)}cqw, ${f(-0.55 * b * I - 1.1 * al + 0.9 * nod + 0.4 * m.hg.y * I)}cqw) rotate(${f(1.1 * sw * I + 0.9 * m.hg.x * I)}deg)`;
    if (E.eyes) E.eyes.style.transform = `translate(${f(0.75 * m.eg.x * I)}cqw, ${f(0.55 * m.eg.y * I)}cqw)`;
    if (E.brows) E.brows.style.transform = `translate(${f(0.45 * m.eg.x * I)}cqw, ${f(-0.9 * al - 1.1 * flash + 0.25 * m.eg.y * I)}cqw)`;
    if (E.mouth) E.mouth.style.transform = `translateX(${f(0.4 * m.eg.x * I)}cqw) scale(${f(1 + 0.14 * al)}, ${f(1 + 0.12 * al)})`;
    const base = this.lidBase || 0;
    const lid = clamp(base * (1 - 0.35 * al) + Math.max(0, m.eg.y) * 10 * I, 0, 100);
    const lh = f(lid + (100 - lid) * bl) + '%';
    if (E.lidL) E.lidL.style.height = lh;
    if (E.lidR) E.lidR.style.height = lh;
    if (E.beacon) E.beacon.style.opacity = f(0.72 + 0.28 * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / 2.2)));
  }
  renderVals() {
    const role = PAL[this.props.role] ? this.props.role : 'support';
    const dir = this.props.dir || 'B';
    const P = PAL[role], F = FUR[P.fur], e = EXPR[this.props.expr] || EXPR[P.expr];
    const W = '#ffffff', K = '#1a120c';
    const c = {
      accent: P.accent, deep: P.deep, accentLight: mix(P.accent, W, .45), brow: F.brow,
    };
    const furL = mix(F.fur, W, .22), furD = mix(F.fur, K, .32);
    const g = {
      head: `radial-gradient(ellipse 85% 95% at 36% 24%, ${furL} 0%, ${F.fur} 48%, ${furD} 100%)`,
      ear: `radial-gradient(ellipse at 40% 30%, ${furL}, ${F.fur} 55%, ${furD})`,
      earInner: `radial-gradient(ellipse at 50% 40%, ${mix(F.inner, W, .2)}, ${F.inner} 60%, ${mix(F.inner, K, .25)})`,
      muzzle: `radial-gradient(ellipse at 42% 28%, ${mix(F.muzzle, W, .3)}, ${mix(F.muzzle, F.fur, .18)} 55%, ${mix(F.muzzle, F.fur, .5)})`,
      lid: `linear-gradient(180deg, ${furL}, ${F.fur})`,
      furBody: `radial-gradient(ellipse 90% 80% at 34% 18%, ${furL}, ${F.fur} 45%, ${furD})`,
      sweater: `radial-gradient(ellipse 90% 80% at 34% 16%, ${mix(P.accent, W, .3)}, ${P.accent} 45%, ${P.deep})`,
      collar: `linear-gradient(180deg, ${mix(P.deep, W, .18)}, ${P.deep} 60%, ${mix(P.deep, K, .25)})`,
      visor: `linear-gradient(180deg, ${mix(P.accent, W, .35)}d9, ${P.accent}e6 60%, ${P.deep}f2)`,
      accentGloss: `radial-gradient(ellipse at 38% 30%, ${mix(P.accent, W, .4)}, ${P.accent} 50%, ${P.deep})`,
      display: `linear-gradient(90deg, ${mix(P.accent, W, .62)}, ${mix(P.accent, W, .38)})`,
    };
    const isC = dir === 'C', isA = dir === 'A', isB = !isA && !isC;
    const acc = isC ? '' : (this.props.acc || P.acc);
    g.neck = acc === 'vest' ? 'linear-gradient(180deg,#fffaf2,#e6dccd 60%,#cdbfaa)' : g.collar;
    const eyeScale = (e.eye || 1) * (isA ? 0.8 : 1);
    this.lidBase = e.lid;
    return {
      refRoot: this.ref('root'), refBody: this.ref('body'), refHead: this.ref('head'), refEyes: this.ref('eyes'),
      refBrows: this.ref('brows'), refMouth: this.ref('mouth'), refLidL: this.ref('lidL'), refLidR: this.ref('lidR'), refBeacon: this.ref('beacon'),
      c, g, ex: e, isA, isB, isC, isW: !isC,
      tilt: e.tilt,
      lid: e.lid,
      eyeL: +(7 * eyeScale).toFixed(2), eyeR: +(6.4 * eyeScale).toFixed(2),
      smile: !e.flat, flat: !!e.flat,
      hasPencil: acc === 'pencil', hasPhones: acc === 'headphones', hasHeadset: acc === 'headset',
      hasRound: acc === 'roundGlasses', hasHalf: acc === 'halfGlasses', hasAntenna: acc === 'antenna',
      hasBeret: acc === 'beret', hasVisor: acc === 'visor', hasClipboard: acc === 'clipboard',
      hasBowtie: acc === 'bowtie', hasRosette: acc === 'rosette', hasMegaphone: acc === 'megaphone',
      hasShade: acc === 'shade', hasCalc: acc === 'calculator', hasVest: acc === 'vest',
      hasDock: acc === 'megaphoneDock', hasMega2: acc === 'megaphone2',
      showBadge: acc !== 'megaphoneDock', hasBubble: acc === 'bubble', hasMagnet: acc === 'magnet',
      hasBand: acc === 'headphones' || acc === 'headset',
      bandW: acc === 'headphones' ? 3.2 : 1.6,
      stageT: this.props.crop === 'head' ? 'translateY(8cqw) scale(1.05)' : 'translateY(6cqw) scale(.9)',
      filt: this.props.silhouette ? 'brightness(0) opacity(.86)' : 'none',
    };
  }
}
</script>
