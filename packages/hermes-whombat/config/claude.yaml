# $HERMES_HOME/config.yaml for a Claude turn (the runner writes it before every turn; nobody else edits it).
# Hermes owns the loop; Nous DirectSDK uses the unmodified CLI on the existing CLAUDE_CONFIG_DIR.
# The runner sets CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND to the installed Claude executable.
model:
  provider: claude-subscription-directsdk-experimental
  default: sonnet
agent:
  reasoning_effort: high
terminal:
  backend: whombat_commands
plugins:
  enabled: [whombat, claude-subscription-directsdk-experimental]
  auto_update_check_hours: 0
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_code_telemetry: false

# Hermes's own login machinery stays out of it (SUB-01, SUB-04, HE-05).
auth:
  adopt_external_logins: false       # never borrow ~/.claude or ~/.codex logins

# Hermes's compression and review use the same subscription provider.
approvals:
  mode: manual                       # a person answers (smart = an auxiliary model would decide)
  timeout: 300
compression:
  enabled: true                      # Hermes keeps and compacts the conversation
auxiliary:
  compression:
    provider: claude-subscription-directsdk-experimental
    model: sonnet
  title_generation:
    enabled: false                   # Whombat names its threads; `true` would run a short `claude -p` per new session
  background_review:
    enabled: true                    # Hermes memory and skill learning through DirectSDK
curator:
  enabled: false
memory:
  memory_enabled: true
  user_profile_enabled: true

# Tools: every Hermes tool eager (session_search included); no Nous connectors.
tools:
  tool_search:
    enabled: "off"
  connectors:
    enabled: false
display:
  busy_input_mode: steer             # a prompt during a running turn joins it (Hermes's steer)

# No self-update, catalogs, telemetry, cron, kanban, LSP downloads or lazy package installs (HE-10).
updates:
  check: false
model_catalog:
  enabled: false
models_dev:
  url: "http://127.0.0.1:9/"         # models.dev refused at once (the image's egress would block it anyway)
web:
  keyless_fallback: false            # no keyless web search of Hermes's own
telemetry:
  shared_metrics:
    enabled: false
    send: false
security:
  allow_lazy_installs: false
lsp:
  enabled: false
kanban:
  dispatch_in_gateway: false
  notify_in_gateway: false
nous:
  keepalive_interval_seconds: 0
gateway:
  standalone: true                   # a profiles/<name> home gets its own gateway (else it waits for the root's multiplexer)
  unmanaged_idle_exit_seconds: 60    # the per-profile daemon `hermes acp` starts ends 60 s after the last client
  respawn_storm:
    max_starts: 0                    # one daemon per turn: never delayed for starting often (HE-37)
