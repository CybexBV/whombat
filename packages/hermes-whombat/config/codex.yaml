# $HERMES_HOME/config.yaml for a ChatGPT turn (the runner writes it before every turn; nobody else edits it).
# Hermes owns the loop with its built-in openai-codex provider (hermes-native.md HN-02): the Responses API at
# chatgpt.com/backend-api/codex on the person's own login, which Hermes keeps in this profile's auth.json (HN-03) and
# nobody else reads. No Codex CLI, no app-server.
model:
  provider: openai-codex
  default: gpt-6-sol                 # the thread's or the agent's model, else Hermes's listed default (HE-67)
agent:
  reasoning_effort: high
  service_tier: fast                 # fast replies asked for (CR-06); `normal` when turned off, absent for the default
terminal:
  backend: whombat_commands
plugins:
  enabled: [whombat]
  auto_update_check_hours: 0

# Hermes's own login machinery stays out of it (SUB-01, SUB-04, HE-05).
auth:
  adopt_external_logins: false       # never borrow ~/.codex or ~/.claude logins

# Hermes's compression and review use the same subscription provider.
approvals:
  mode: manual                       # a person answers (smart = an auxiliary model would decide)
  timeout: 7200
compression:
  enabled: true                      # Hermes keeps and compacts the conversation
auxiliary:
  compression:
    provider: openai-codex
    model: gpt-6-sol
  title_generation:
    enabled: false                   # Whombat names its threads
  background_review:
    enabled: true                    # Hermes memory and skill learning; the plugin marks it running (HN-08)
curator:
  enabled: false
memory:
  memory_enabled: true
  user_profile_enabled: true

# Tools: every Hermes tool eager (session_search included); no Nous connectors.
tools:
  tool_search:
    enabled: "off"
  connectors:
    enabled: false
display:
  busy_input_mode: steer             # a prompt during a running turn joins it (Hermes's steer)

# No self-update, catalogs, telemetry, cron, kanban, LSP downloads or lazy package installs (HE-10).
updates:
  check: false
model_catalog:
  enabled: false
models_dev:
  url: "http://127.0.0.1:9/"         # models.dev refused at once (the image's egress would block it anyway)
web:
  keyless_fallback: false            # no keyless web search of Hermes's own
telemetry:
  shared_metrics:
    enabled: false
    send: false
security:
  allow_lazy_installs: false
lsp:
  enabled: false
kanban:
  dispatch_in_gateway: false
  notify_in_gateway: false
nous:
  keepalive_interval_seconds: 0
gateway:
  standalone: true                   # a profiles/<name> home gets its own gateway (else it waits for the root's multiplexer)
  unmanaged_idle_exit_seconds: 60    # the per-profile daemon `hermes acp` starts ends 60 s after the last client
  respawn_storm:
    max_starts: 0                    # one daemon per turn: never delayed for starting often (HE-37)
