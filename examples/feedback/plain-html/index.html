<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Only if your site sends a Content-Security-Policy: allow Whombat's origin for scripts and frames.
  Nothing else is needed (no connect-src, no 'unsafe-inline'). A header works the same as this meta tag.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://whombat.example.com; frame-src https://whombat.example.com; style-src 'self'; img-src 'self'">
<title>Orders · Acme Shop</title>
<link rel="stylesheet" href="/style.css">
<!-- Whombat Feedback: the snippet from Settings → Connections → Website feedback, pasted as it is. -->
<script
  src="https://whombat.example.com/embed/v1/widget.js"
  data-site="fbs_REPLACEwithYourSiteId000"
  data-theme="auto"
  data-position="bottom-right"
  defer
></script>
</head>
<body>
<header><strong>Acme Shop</strong></header>
<main>
  <h1>Your orders</h1>
  <p>An ordinary page with the one-line installation. The “Feedback” button in the corner is the widget.</p>
  <ul>
    <li>Order 1042 · 2 items · shipped 12 September</li>
    <li>Order 1038 · 1 item · delivered 3 September</li>
  </ul>
</main>
</body>
</html>
