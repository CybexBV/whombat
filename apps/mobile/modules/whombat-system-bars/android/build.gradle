plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.whombat'
version = '0.1.0'

android {
  namespace "com.whombat.systembars"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // WindowInsetsControllerCompat: the navigation bar's light/dark appearance on every Android version (AP-2751).
  implementation 'androidx.core:core:1.13.1'
}
