plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.whombat'
version = '0.1.0'

android {
  namespace "com.whombat.passkeys"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Passkeys through Android's Credential Manager (passkeys.md AP-798); Play services brings them to Android 9–13.
  // 1.6.0 brings the signal requests that tell the passkey provider which passkeys no longer work.
  implementation 'androidx.credentials:credentials:1.6.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}
