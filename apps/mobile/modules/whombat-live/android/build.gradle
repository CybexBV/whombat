plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.whombat'
version = '0.1.0'

android {
  namespace "com.whombat.live"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // Test builds without Firebase (EXPO_PUBLIC_WHOMBAT_PUSH_RELAY=1, never a shipped build): the release build
  // also gets the debug receiver, so pushes relayed by `scripts/push.mjs` reach a release APK on an emulator.
  if (System.getenv('EXPO_PUBLIC_WHOMBAT_PUSH_RELAY') == '1') {
    sourceSets {
      release {
        java.srcDirs += 'src/debug/java'
        manifest.srcFile 'src/debug/AndroidManifest.xml'
      }
    }
  }
}

dependencies {
  // NotificationCompat with setRequestPromotedOngoing / setShortCriticalText (Android 16 Live Updates).
  implementation 'androidx.core:core:1.17.0'
  // Same version as expo-notifications, which fetches the FCM token; this module receives the messages.
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
