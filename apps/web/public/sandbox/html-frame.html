<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The HTML preview frame (AP-320). The same policy as the `/sandbox/*` block of the hosted build's _headers
         (which adds frame-ancestors), so every server that serves this file confines the page the same way.
         It stays in force after html-frame.js writes the page (document.open keeps the policies). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' data:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Preview</title>
    <script src="/sandbox/html-frame.js"></script>
  </head>
  <body></body>
</html>
