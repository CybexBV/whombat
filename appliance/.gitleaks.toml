# Secret scanning (gitleaks): public CI scans every pull request with this config, and the maintainers' push hook
# every push. The allowlist names reviewed files one by one, so a new secret in any other file, a test included, stops
# it until someone has looked at it. Add a path only after checking every value gitleaks flags in it is made up (a test
# token, a documented example key, a key generated for the test and used nowhere else).

[extend]
useDefault = true

[[allowlists]]
description = "The contracts' conformance vectors (vendored, the same files the Whombat repository allowlists) and the vendored contracts release tarballs that carry them: development keys derived from public seeds, dummy secrets"
paths = [
  '''^harness/vendor/whombat-contracts/4\.11\.0/whombat-contracts-(go|schema)-4\.11\.0\.tar\.gz$''',
]

[[allowlists]]
description = "Reviewed tests: made-up tokens, a made-up commit id and a key file's name"
paths = [
  '''^backup/internal/quarantine/undo_test\.go$''',
  '''^console/internal/web/web_test\.go$''',
  '''^harness/src/dev/candidate-plan\.test\.ts$''',
]

[[allowlists]]
description = "Reviewed: a Go type alias in tufrepo's channel commands (`type devtufKey = ed25519.PrivateKey`) that the generic-api-key rule reads as a key; it holds no value"
regexTarget = "match"
regexes = ['''^devtufKey = ed25519\.PrivateKey$''']
