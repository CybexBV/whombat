# Headscale for the community install test (IN-430; Headscale v0.29.5's config-example.yaml, trimmed): the coordination
# server a community box's owner names as its Tailscale login server (Whombat HE-64). Runs in a throwaway container;
# SERVER_URL is replaced by the address the box reaches it at (QEMU's user network: the host's port, 10.0.2.2).
# No ACL policy (everyone in the tailnet reaches everyone), Tailscale's public DERP relays, nothing kept.
server_url: SERVER_URL
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
log:
  level: info
  format: text
policy:
  mode: file
  path: ""
dns:
  magic_dns: true
  base_domain: hs.test
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
  search_domains: []
  extra_records: []
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"
logtail:
  enabled: false
taildrop:
  enabled: false
