<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0b09}
.frame{display:inline-block;margin:0 0 40px;vertical-align:top}
.sheet{position:relative;background:#1c1815;color:#f1ebe3;font-family:'Bricolage Grotesque',sans-serif;padding:34px 40px 10px}
.sheet h2{font-size:24px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
.sheet p{font-size:16px;color:#a0958a;margin:0 0 26px}
.srow{display:flex;gap:24px;align-items:flex-start;margin-bottom:30px}
.sheet *{box-sizing:border-box}
.srow .tl{width:150px;flex:none;font-size:16px;font-weight:600;padding-top:30px}
.srow .tl span{display:block;font-weight:400;color:#a0958a;font-size:14px;margin-top:4px}
.smp .sz{font-family:'DM Mono',monospace;font-size:13px;color:#7d746a;margin-bottom:8px}
.smp .box{position:relative}
/* The screen: Whombat's dark tokens (bg #1c1815, sf #24201c, ink #f1ebe3, mut #a0958a, ok/warn/bad, brand sand). */
.scr{position:relative;background:#1c1815;color:#f1ebe3;font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;
  transform-origin:0 0;-webkit-font-smoothing:antialiased}
.scr *{box-sizing:border-box}
.scr .mono{font-family:'DM Mono',ui-monospace,monospace}
.edge{position:absolute;left:0;right:0;top:0;height:4px;background:#e59a85;box-shadow:0 0 40px 6px rgba(229,154,133,.45);z-index:5}

/* top bar */
.tb{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;padding:0 24px;font-size:15px;color:#a0958a;z-index:4}
.tb .nm{color:#f1ebe3;font-weight:650;font-size:18px;letter-spacing:-.01em}
.tb .pg{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:26px;font-size:16px}
.tb .pg span{position:relative;padding:4px 0}
.tb .pg span.on{color:#f1ebe3;font-weight:600}
.tb .pg span.on:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;border-radius:2px;background:#d2b49a}
.tb .pg span.on.turn:after{right:38%}
.tb.narrow .pg{position:static;transform:none;margin-left:34px;gap:20px}
.tb .pg.dots{gap:9px}
.tb .pg.dots span{width:8px;height:8px;border-radius:50%;background:#4a433c;padding:0}
.tb .pg.dots span.on{background:#f1ebe3}.tb .pg.dots span.on:after{display:none}
.tb .rt{margin-left:auto;display:flex;gap:18px;align-items:center}
.tb .ch{display:flex;align-items:center;gap:7px;white-space:nowrap}
.tb .ch svg{display:block}
.tb .pill{margin-left:16px;background:#e59a85;color:#1c1815;font-weight:650;padding:7px 14px 7px 12px;border-radius:999px;display:flex;align-items:center;gap:8px}
.tb .pill i{width:8px;height:8px;border-radius:50%;background:#1c1815;display:block}

/* editing: the cells */
.cell{position:absolute;border:1.5px dashed rgba(255,255,255,.09);border-radius:16px}

/* widgets */
.w{position:absolute;box-sizing:border-box;background:#24201c;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:15px 18px;overflow:hidden}
.w.bare{background:transparent;border-color:transparent}
.w.bad{border-color:rgba(229,154,133,.6);background:linear-gradient(180deg,rgba(229,154,133,.12),rgba(229,154,133,.04))}
.w.warnc{border-color:rgba(224,183,94,.45)}
.w.flush{padding:0}
.hd{display:flex;align-items:center;gap:9px;font-size:15px;color:#a0958a;white-space:nowrap;height:24px}
.hd .n{overflow:hidden;text-overflow:ellipsis}
.hd .n b{color:#f1ebe3;font-weight:600}
.hd .r{margin-left:auto;color:#a0958a}
.mk{display:inline-grid;place-items:center;flex:none;border-radius:7px;font-weight:800;color:#1c1815;letter-spacing:-.02em}
.mk.ic{background:#2e2925;color:#d2b49a}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.08;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin-top:10px}
.d{font-size:15px;color:#a0958a;margin-top:6px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okc{color:#6fcf97}.warn{color:#e0b75e}.badc{color:#e59a85}.sand{color:#d2b49a}
.bar{height:7px;border-radius:4px;background:#3a342e;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:4px}
.bar.thin{height:4px;margin-top:8px}
.rows{margin-top:10px;display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:12px;min-height:38px;border-top:1px solid rgba(255,255,255,.06);font-size:16px}
.rw:first-child{border-top:0}
.rw .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .s{color:#a0958a;font-size:14px;white-space:nowrap}
.rw .t{font-family:'DM Mono',monospace;font-size:14px;color:#d2b49a;width:52px;flex:none}
.rw .two{flex:1;min-width:0;padding:7px 0}
.rw .two b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .two span{display:block;color:#a0958a;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:grid;grid-template-columns:70px 1fr 46px;align-items:center;gap:10px;font-size:15px;color:#a0958a;height:30px}
.meter .bar{margin:0}
.meter b{color:#f1ebe3;font-weight:600;text-align:right}
.lab{font-size:14px;letter-spacing:.14em;color:#7d746a;text-transform:uppercase}
.poster{border-radius:8px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.poster span{position:absolute;left:7px;right:7px;bottom:6px;font-size:11px;font-weight:700;line-height:1.1;color:rgba(255,255,255,.88);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dot{display:inline-block;border-radius:50%;flex:none}

/* clock and status (bare) */
.ck{height:100%;display:flex;flex-direction:column;justify-content:center;padding-left:4px}
.ck.row{flex-direction:row;align-items:center;justify-content:flex-start;gap:26px}
.ck-t{font-weight:700;letter-spacing:-.045em;line-height:.86;white-space:nowrap}
.ck-t .co{margin:0 .04em;position:relative;top:-.06em}
.ck-d{color:#a0958a;margin-top:12px;white-space:nowrap}
.ck.row .ck-d{margin-top:0}
.st{height:100%;display:flex;flex-direction:column;justify-content:center}
.st-h{font-weight:650;letter-spacing:-.02em;display:flex;align-items:center;gap:16px;white-space:nowrap}
.st-s{font-size:22px;color:#a0958a;margin-top:10px;line-height:1.35}

/* what's going on (bare) */
.nw{height:100%;display:flex;flex-direction:column}
.nw-h{display:flex;justify-content:space-between;align-items:center;height:26px}
.nw-h .r{font-size:16px;color:#a0958a}
.nw-c{flex:1;display:grid;gap:12px;margin-top:10px;min-height:0}
.nw-c .mc{background:#24201c;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:16px 18px;min-height:0;overflow:hidden}
.nw-e{flex:1;display:grid;place-items:center;color:#7d746a;font-size:18px;border:1.5px dashed rgba(255,255,255,.07);border-radius:18px;margin-top:10px}

/* servers strip (bare) */
.sp{height:100%;display:grid;gap:10px}
.chip{background:#24201c;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 13px 10px;overflow:hidden;min-width:0}
.chip .h{display:flex;align-items:center;gap:7px;font-size:15px;white-space:nowrap;overflow:hidden}
.chip svg{display:block;margin-top:12px}
.chip .nt{font-size:16px;margin-top:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.bad{border-color:rgba(229,154,133,.6);background:rgba(229,154,133,.09)}.chip.bad .nt{color:#e59a85}
.chip.warn{border-color:rgba(224,183,94,.5);background:rgba(224,183,94,.06)}.chip.warn .nt{color:#e0b75e}
.chip.off{opacity:.45}.chip.off .nt{color:#a0958a}
.chip.more{display:grid;place-items:center;font-size:20px;color:#a0958a}

/* camera */
.cam{position:absolute;inset:0}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.cam .top{position:absolute;left:16px;right:16px;top:14px;display:flex;align-items:center;gap:9px;font-size:15px;color:#f1ebe3;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cam .top .r{margin-left:auto;font-family:'DM Mono',monospace;font-size:14px;color:#d8cfc4}
.cam .ev{position:absolute;left:16px;bottom:14px;background:rgba(28,24,21,.78);border-radius:999px;padding:7px 13px;font-size:14px;display:flex;align-items:center;gap:8px}
.cam .live{width:8px;height:8px;border-radius:50%;background:#e59a85;box-shadow:0 0 0 4px rgba(229,154,133,.25)}
.cam .lockd{position:absolute;inset:0;background:#2a2622;display:grid;place-items:center;color:#a0958a;font-size:16px;text-align:center}

/* the modal */
.ov{position:absolute;left:0;right:0;top:56px;bottom:0;background:rgba(17,14,12,.72);z-index:6}
.md{position:absolute;left:50%;top:calc(56px + (100% - 56px)/2);transform:translate(-50%,-50%);z-index:7;background:#24201c;border-radius:30px;
  padding:38px 44px 40px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.md.problem{border:1.5px solid rgba(229,154,133,.65);background:linear-gradient(180deg,#3a2622,#24201c 70%)}
.md.ask{border:1.5px solid rgba(143,127,201,.55);background:linear-gradient(180deg,#2c2733,#24201c 70%)}
.md-top{display:flex;align-items:center;justify-content:space-between;font-family:'DM Mono',monospace;font-size:17px;letter-spacing:.06em}
.md-top .cnt{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:0;font-size:18px;color:#a0958a;display:flex;gap:14px;align-items:center}
.md-top .cnt b{display:inline-grid;line-height:0;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid #4a443d;color:#f1ebe3;font-weight:500}
.md-t{font-size:56px;font-weight:650;letter-spacing:-.025em;line-height:1.05;margin-top:16px}
.md-s{font-size:24px;color:#a0958a;margin-top:14px;line-height:1.4}
.md-q{font-size:22px;line-height:1.45;color:#d8cfc4;margin-top:22px;padding:18px 22px;border-left:3px solid #8f7fc9;background:rgba(255,255,255,.035);border-radius:4px 14px 14px 4px}
.md-b{margin-top:34px;display:flex;gap:12px;align-items:center}
.btn{display:inline-block;font-size:22px;font-weight:600;padding:16px 28px;border-radius:999px;white-space:nowrap}
.btn.p{background:#f1ebe3;color:#1c1815}.btn.o{border:1.5px solid #4a443d;color:#f1ebe3}.btn.t{color:#a0958a;padding-left:10px}
.face{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#8f7fc9;color:#1c1815;font-weight:800;font-size:15px;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:0}
.md-lock{margin-top:18px;font-size:18px;color:#a0958a;display:flex;align-items:center;gap:8px}

/* editing: selection, handles, ghost */
.w.sel{outline:4px solid #d2b49a;outline-offset:4px;z-index:3}
.editing .w.bare{background:rgba(255,255,255,.025);border:1.5px dashed rgba(255,255,255,.13)}
.editing .w.bare.drag,.editing .w.bare.sel{background:#24201c}
.w.drag{opacity:.9;z-index:4;box-shadow:0 24px 60px rgba(0,0,0,.6);cursor:grabbing}
.w .hdl{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:11px;background:#d2b49a;cursor:nwse-resize;z-index:2;
  display:grid;place-items:center}
.w .hdl:before{content:"";width:12px;height:12px;border-right:3px solid #1c1815;border-bottom:3px solid #1c1815;border-radius:0 0 3px 0}
.w .rm{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;background:#f1ebe3;color:#1c1815;z-index:2;
  display:grid;place-items:center;font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.gh{position:absolute;border-radius:20px;border:4px solid #d2b49a;background:rgba(210,180,154,.12);z-index:2;pointer-events:none}
.gh.no{border-color:#e59a85;background:rgba(229,154,133,.16)}
.gh .w{opacity:.55;inset:0;left:0;top:0;width:100%;height:100%;border:0}
.empty{position:absolute;left:20px;right:20px;top:56px;bottom:20px;display:grid;place-items:center;color:#7d746a;font-size:22px;text-align:center;line-height:1.5;pointer-events:none}

/* The web app, light: Whombat's light tokens. */
.ui{--bg:#fbf9f5;--side:#f3eee6;--sf:#fffdf9;--sf2:#f1ece4;--ink:#221d18;--ink2:#3d352e;--mut:#6e655c;--line:rgba(34,29,24,.09);
  --line2:rgba(34,29,24,.18);--btn:#221d18;--btnfg:#f5f2ed;--ok:#3e7b58;--warn:#8d6d2d;--bad:#9f5540;--sel:rgba(34,29,24,.06);--brand:#7d6353;
  font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px}
.ui *{box-sizing:border-box}
.ui button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ui .b{height:36px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ui .b.p{background:var(--btn);color:var(--btnfg)}
.ui .b.o{border:1px solid var(--line2);background:var(--sf)}
.ui .b.g{color:var(--mut)}
.ui .b:disabled{opacity:.4;cursor:default}
.ui .b:focus-visible,.ui .seg button:focus-visible,.ui .ci:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ui .seg{display:inline-flex;background:var(--sf2);border-radius:999px;padding:3px}
.ui .seg button{padding:5px 12px;border-radius:999px;color:var(--mut);font-size:13px;white-space:nowrap}
.ui .seg button.on{background:var(--sf);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(34,29,24,.12)}
.ui .card{background:var(--sf);border:1px solid var(--line);border-radius:16px}
.ui .lab{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;font-weight:600}
.ui .mut{color:var(--mut)}
.ui .tg{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--sf2);color:var(--mut);font-size:12px;white-space:nowrap}
.ui .sw{width:38px;height:22px;border-radius:999px;background:#3e7b58;position:relative;flex:none}
.ui .sw:after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.ui .mk{display:inline-grid;place-items:center;flex:none;border-radius:7px;font-weight:800;color:#1c1815}
.ui .mk.ic{background:#2e2925;color:#d2b49a}

/* Settings page */
.st-page{padding:36px 40px}
.st-page h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.st-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px;font-size:15px;color:var(--mut)}
.st-tabs span{padding:10px 0;position:relative}
.st-tabs span.on{color:var(--ink);font-weight:600}
.st-tabs span.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.scr-row{display:flex;gap:22px;align-items:center;padding:18px 20px;border-top:1px solid var(--line)}
.scr-row:first-child{border-top:0}
.scr-row .th{flex:none;border-radius:10px;overflow:hidden;background:#0d0b09;padding:5px}
.scr-row .tx{flex:1;min-width:0}
.scr-row .tx b{font-size:16px;font-weight:600}
.scr-row .tx div{margin-top:4px;color:var(--mut);font-size:14px}
.dlg-ov{position:absolute;inset:0;background:rgba(34,29,24,.32)}
.dlg{position:absolute;background:var(--sf);border-radius:20px;box-shadow:0 24px 70px rgba(34,29,24,.28);padding:26px 28px}
.code{display:flex;gap:8px;margin-top:10px}
.code span{width:44px;height:52px;border:1px solid var(--line2);border-radius:10px;display:grid;place-items:center;font-size:24px;font-weight:600;background:var(--bg)}
.code span.cur{border:2px solid var(--ink)}
.fld{margin-top:18px}
.fld>label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.inp{height:40px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;display:flex;align-items:center;background:var(--sf);font-size:14px}

<div id="out"></div>
<script>
/* The widget kit: one renderer for the box's screen, monitors, tablets and the editor's preview. */
const K = (() => {
  const BAR = 56, PAD = 20, GAP = 12, TARGET = 140;
  const C = { ink: '#f1ebe3', mut: '#a0958a', ok: '#6fcf97', warn: '#e0b75e', bad: '#e59a85', sand: '#d2b49a', dusty: '#8f7fc9' };

  /* The grid comes from the screen: as many cells of about 140 px as fit, stretched to fill. Size is a zoom. */
  function grid(W, H, zoom = 1) {
    const w = W / zoom, h = H / zoom;
    const cols = Math.max(2, Math.round((w - 2 * PAD + GAP) / (TARGET + GAP)));
    const rows = Math.max(2, Math.round((h - BAR - PAD + GAP) / (TARGET + GAP)));
    return { W: w, H: h, cols, rows, zoom, cw: (w - 2 * PAD - (cols - 1) * GAP) / cols, ch: (h - BAR - PAD - (rows - 1) * GAP) / rows };
  }
  const rect = (g, d) => ({ x: PAD + d.x * (g.cw + GAP), y: BAR + d.y * (g.ch + GAP), w: d.w * g.cw + (d.w - 1) * GAP, h: d.h * g.ch + (d.h - 1) * GAP });
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  function fits(ws, c, g, ignore) {
    if (c.x < 0 || c.y < 0 || c.x + c.w > g.cols || c.y + c.h > g.rows) return false;
    return ws.every((o) => o.id === ignore || !overlaps(o, c));
  }
  function firstFree(ws, w, h, g) {
    for (let y = 0; y + h <= g.rows; y++) for (let x = 0; x + w <= g.cols; x++) if (fits(ws, { x, y, w, h }, g)) return { x, y };
    return null;
  }
  /* Another shape: keep what fits where it is, stretch full-width ones, the rest to the first free spot, smaller if it must. */
  function reflow(ws, oldCols, g) {
    const out = [], dropped = [];
    for (const d of [...ws].sort((a, b) => a.y - b.y || a.x - b.x)) {
      const t = T[d.t];
      let w = d.w === oldCols ? Math.min(g.cols, t.max[0]) : Math.min(d.w, g.cols, t.max[0]);
      let h = Math.min(d.h, g.rows);
      const c = { ...d, w, h };
      if (fits(out, c, g)) { out.push(c); continue; }
      let p = firstFree(out, w, h, g);
      if (p) { out.push({ ...c, ...p }); continue; }
      let done = false;
      for (let hh = h; hh >= t.min[1] && !done; hh--)
        for (let ww = w; ww >= t.min[0] && !done; ww--) {
          p = firstFree(out, ww, hh, g);
          if (p) { out.push({ ...d, ...p, w: ww, h: hh }); done = true; }
        }
      if (!done) dropped.push(d);
    }
    return { ws: out, dropped };
  }

  /* drawing helpers */
  function series(seed, n = 25, lo = 3, hi = 27, start = 10) {
    let x = seed * 9301 + 49297, v = start; const p = [];
    for (let i = 0; i < n; i++) { x = (x * 9301 + 49297) % 233280; v = Math.max(lo, Math.min(hi, v + (x / 233280 - 0.5) * 8)); p.push(v); }
    return p;
  }
  function spark(seed, w, h, color = C.ok, fill = false, n = 25) {
    w = Math.max(10, Math.round(w)); h = Math.max(10, Math.round(h));
    const p = series(seed, n), pts = p.map((v, i) => [(i / (p.length - 1)) * w, h - 2 - (v / 30) * (h - 4)]);
    const line = pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${fill ? `<polygon points="0,${h} ${line} ${w},${h}" fill="${color}" fill-opacity=".13"/>` : ''}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-opacity=".9"/></svg>`;
  }
  function chart(seed, w, h, color, limit) {

  T.calendar = {

    render(c) {

  /* What Add a widget lists, by where it comes from. */
  const GROUPS = [
    { k: 'whombat', label: 'Whombat and Dusty', items: [['clock'], ['status'], ['now'], ['strip'], ['work'], ['coming'], ['done']] },
    { k: 'servers', label: 'Servers', items: SERVERS.filter((s) => !s.off).map((s) => ['server', { id: s.id }, s.id, s.sub]) },
    { k: 'plex', label: 'Plex', items: [['plexNow'], ['plexRecent'], ['plexLib']] },
    { k: 'sab', label: 'SABnzbd', items: [['sab']] },
    { k: 'seerr', label: 'Seerr', items: [['seerr']] },
    { k: 'sonarr', label: 'Sonarr', items: [['sonarr']] },
    { k: 'ha', label: 'Home Assistant', items: [['climate'], ['lights'], ['camera']] },
    { k: 'unifi', label: 'UniFi', items: [['internet']] },
    { k: 'pihole', label: 'Pi-hole', items: [['pihole']] },
    { k: 'synology', label: 'Synology', items: [['storage']] },
    { k: 'pbs', label: 'Proxmox Backup Server', items: [['backups']] },
    { k: 'gcal', label: 'Google Calendar', items: [['calendar']] },
  ];

  /* one widget, absolutely placed on the screen */
  function widget(g, d, o = {}) {
    const t = T[d.t], r = rect(g, d);
    const c = { w: d.w, h: d.h, pw: r.w, ph: r.h, sc: o.sc || 'calm', o: d.o || {}, locked: o.locked };
    const bad = t.bad ? t.bad(c) : false;
    const cls = ['w', t.bare ? 'bare' : '', t.flush ? 'flush' : '', bad ? 'bad' : '', t.warn ? 'warnc' : '', o.sel === d.id ? 'sel' : ''].join(' ');
    const handles = o.sel === d.id ? '<span class="rm" title="Remove">×</span><span class="hdl" title="Drag to resize"></span>' : '';
    const pos = o.at ? `left:0;top:0;width:100%;height:100%` : `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
    return `<div class="${cls}" data-id="${d.id}" style="${pos}">${t.render(c)}${handles}</div>`;
  }

  const SVG = {
    wifi: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>',
    batt: '<svg width="24" height="16" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="2" width="21" height="12" rx="3"/><rect x="3.5" y="4.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M24.5 6v4" stroke-linecap="round"/></svg>',
    lock: '<svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1.5" y="7.5" width="13" height="9" rx="2.5"/><path d="M4.5 7.5V5a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  };
  function topbar(o) {
    const chips = (o.chips || ['wifi', 'online', 'battery', 'lock']).map((k) => ({
      wifi: `<span class="ch">${SVG.wifi}Ziggo-5G</span>`,
      online: `<span class="ch"><span class="dot" style="width:8px;height:8px;background:${C.ok}"></span>Online</span>`,
      battery: `<span class="ch">${SVG.batt}84 %</span>`,
      lock: `<span class="ch">${SVG.lock}${o.locked === false ? 'Unlocked' : 'Locked'}</span>`,
      help: `<span class="ch">Remote help on</span>`,
    }[k])).join('');
    const pages = (o.pages || []).length > 1
      ? `<div class="pg ${o.dots ? 'dots' : ''}">${o.pages.map((p, i) => `<span class="${i === o.page ? 'on' : ''} ${i === o.page && o.autoTurn ? 'turn' : ''}">${o.dots ? '' : p}</span>`).join('')}</div>` : '';
    const pill = o.pill ? `<span class="pill"><i></i>${o.pill}</span>` : '';
    return `<div class="tb ${o.narrow ? 'narrow' : ''}"><span class="nm">${o.name || 'Home'}</span>${pill}${pages}<div class="rt">${chips}</div></div>`;
  }
  const CHEV = (d) => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d > 0 ? 'M5 2l5 5-5 5' : 'M9 2L4 7l5 5'}"/></svg>`;
  function modal(m) {
    if (m.kind === 'problem')
      return `<div class="ov"></div><div class="md problem" style="width:${m.width || 860}px"><div class="md-top"><span class="badc">SINCE 14:30 · 4 MIN</span><span class="cnt">1 of 2<b>${CHEV(1)}</b></span></div>
        <div class="md-t">pve-02 isn’t answering</div><div class="md-s">Plex, SABnzbd and Seerr run on it, so they’re down too.</div>
        <div class="md-b"><span class="btn p">Ask Dusty to fix it</span><span class="btn o">Open pve-02</span><span class="btn t">Not now</span></div></div>`;
    return `<div class="ov"></div><div class="md ask" style="width:${m.width || 860}px"><div class="md-top"><span style="display:flex;align-items:center;gap:12px;color:#c8bde8"><span class="face">D</span>DUSTY ASKS · 14:36</span><span class="cnt"><b>${CHEV(-1)}</b>2 of 2</span></div>
      <div class="md-t" style="font-size:46px">Send this reply to Bakkerij de Vries?</div>
      <div class="md-q">“Hi Marieke, the order form works again. Your three orders from this morning came through fine.”</div>
      <div class="md-b"><span class="btn p">Send it</span><span class="btn o">Change it first</span><span class="btn t">Not now</span></div>
      ${m.locked ? '<div class="md-lock">' + SVG.lock + 'Your PIN first, then it sends.</div>' : ''}</div>`;
  }
  /* a whole screen at its logical size */
  function screen(o) {
    const g = grid(o.W, o.H, o.zoom || 1);
    let h = `<div class="scr ${o.editing ? 'editing' : ''}" style="width:${g.W}px;height:${g.H}px">`;
    if (o.edge) h += '<div class="edge"></div>';
    h += topbar({ ...o, narrow: g.W < 1100 && !o.dots });
    if (o.editing) for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++) { const r = rect(g, { x, y, w: 1, h: 1 }); h += `<div class="cell" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"></div>`; }
    for (const d of o.ws) h += widget(g, d, o);
    if (o.editing && !o.ws.length) h += '<div class="empty">An empty page.<br>Drag widgets here, or press + on one.</div>';
    if (o.modal) h += modal(o.modal);
    return { html: h + '</div>', g };
  }
  /* a screen scaled into a box of the given width */
  function fitted(o, width) {
    const { html, g } = screen(o), s = width / g.W;
    return `<div style="width:${width}px;height:${Math.round(g.H * s)}px;overflow:hidden;position:relative"><div style="transform:scale(${s});transform-origin:0 0;width:${g.W}px;height:${g.H}px">${html}</div></div>`;
  }

  function fittedBox(o, mw, mh) {
    const g = grid(o.W, o.H, o.zoom || 1), s = Math.min(mw / g.W, mh / g.H);
    return `<div style="width:${mw}px;height:${mh}px;display:grid;place-items:center"><div style="width:${Math.round(g.W * s)}px;height:${Math.round(g.H * s)}px;overflow:hidden;position:relative;border-radius:4px"><div style="transform:scale(${s});transform-origin:0 0;width:${g.W}px;height:${g.H}px">${screen(o).html}</div></div></div>`;
  }

  let n = 0;
  const L = (rows) => rows.map(([t, x, y, w, h, o]) => ({ id: 'w' + ++n, t, x, y, w, h, o: o || {} }));
  const LAYOUTS = {
    defaultLaptop: () => L([['clock', 0, 0, 4, 2], ['status', 4, 0, 4, 2], ['now', 0, 2, 8, 2], ['strip', 0, 4, 8, 1]]),

    media: () => L([['plexNow', 0, 0, 4, 3], ['sab', 4, 0, 4, 2], ['seerr', 4, 2, 2, 2], ['sonarr', 6, 2, 2, 2], ['plexRecent', 0, 3, 4, 2], ['plexLib', 4, 4, 4, 1]]),
    house: () => L([['camera', 0, 0, 4, 3], ['lights', 4, 0, 2, 3], ['climate', 6, 0, 2, 1], ['climate', 6, 1, 2, 1, { sensor: 'Outside' }], ['pihole', 6, 2, 2, 1], ['calendar', 0, 3, 4, 2], ['coming', 4, 3, 2, 2], ['backups', 6, 3, 2, 1], ['storage', 6, 4, 2, 1]]),
    monitor: () => L([['clock', 0, 0, 3, 2], ['status', 3, 0, 3, 2], ['climate', 6, 0, 2, 2], ['internet', 8, 0, 4, 2], ['now', 0, 2, 6, 2], ['plexNow', 6, 2, 3, 3], ['sab', 9, 2, 3, 3], ['server', 0, 4, 3, 2, { id: 'pve-01' }], ['storage', 3, 4, 3, 2], ['seerr', 6, 5, 3, 1], ['backups', 9, 5, 3, 1], ['strip', 0, 6, 12, 1]]),
    tablet: () => L([['clock', 0, 0, 5, 1], ['camera', 0, 1, 3, 2], ['climate', 3, 1, 2, 1], ['lights', 3, 2, 2, 1], ['calendar', 0, 3, 5, 2], ['plexNow', 0, 5, 3, 2], ['sonarr', 3, 5, 2, 2]]),
  };

  return { BAR, PAD, GAP, C, grid, rect, fits, firstFree, reflow, T, GROUPS, SERVERS, widget, screen, fitted, fittedBox, topbar, LAYOUTS, mk, ico };
})();

{
