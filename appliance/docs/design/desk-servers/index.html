<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whombat on the desk — server cards and a server's own screen</title>
<link rel="stylesheet" href="../desk-display/fonts/fonts.css">
<link rel="stylesheet" href="../desk-display/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0b0a;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:36px 40px 60px;color:#f1ebe3}
.shot{margin-bottom:46px}
.caption{font:500 12px var(--font-mono);color:#d2b49a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.z13{display:inline-block;background:#050505;border-radius:30px;padding:26px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px #222}
.z13::before{content:"";position:absolute;top:10px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#1b1b1b;box-shadow:0 0 0 1px #2a2a2a}
.screen{width:1280px;height:800px;background:var(--bg);color:var(--ink);overflow:hidden;border-radius:6px;position:relative}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.label{font:500 12.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--radius-card-large)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
/* glance (as console/ui desk.module.css) */
.glance{position:absolute;inset:0;padding:26px 36px 28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;height:30px;flex:none}
.top img{width:30px;height:24px}
.top b{font:600 17px var(--font-sans)}
.top .sp{flex:1}
.top .chip{display:flex;align-items:center;gap:7px;font:400 14px var(--font-sans);color:var(--ink2)}
.top .chip svg{width:18px;height:18px;color:var(--mut)}
.top .sep{width:1px;height:16px;background:var(--line2)}
.hero{display:grid;grid-template-columns:1fr 470px;gap:24px;flex:none}
.clock{font:700 118px/0.9 var(--font-sans);letter-spacing:-.045em;margin-top:6px}
.clock small{font:500 24px var(--font-sans);letter-spacing:-.01em;color:var(--mut);margin-left:14px}
.say{display:flex;gap:16px;align-items:center;margin-top:18px}
.say img{width:54px;height:54px;border-radius:50%;background:var(--role-operator);flex:none}
.say p{font:500 25px/1.3 var(--font-sans);letter-spacing:-.01em}
.needs{padding:20px 22px;display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.needs .hd{display:flex;align-items:center;gap:10px}
.needs .n{font:600 13px var(--font-sans);background:var(--warn);color:#1c1815;border-radius:999px;padding:1px 8px}
.needs .unlock{display:flex;align-items:center;gap:8px;font:500 14.5px var(--font-sans);color:var(--ink2);margin-top:6px}
.needs .unlock svg{width:17px;height:17px}

/* NEW: three server cards a row, each figure on its own line */
.srv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:none}
.s{padding:14px 18px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
.s.self{border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.s.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.s .nm{display:flex;align-items:center;gap:10px;min-width:0}
.lg{width:30px;height:30px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;flex:none}
.lg img{width:22px;height:18px}
.mk{width:18px;height:18px;display:block;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:var(--c)}
.s .nm b{font:500 16.5px var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .nm span{font:400 13px var(--font-sans);color:var(--mut);margin-left:auto;white-space:nowrap}
.s.warn .nm span{color:var(--warn)}
.s .chev{width:16px;height:16px;color:var(--mut);margin-left:2px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:46px 1fr 50px;align-items:center;gap:12px}
.bar .k{font:500 11.5px var(--font-mono);letter-spacing:.06em;color:var(--mut)}
.bar .v{font:600 15px var(--font-sans);text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:7px;border-radius:1.5px;background:var(--sf2)}
.seg.ok i.on{background:var(--ok)}.seg.warn i.on{background:var(--warn)}.seg.bad i.on{background:var(--bad)}
.more{margin:-10px 0 0;display:flex;justify-content:flex-end;flex:none}
.more span{font:400 13px/16px var(--font-sans);color:var(--mut);display:flex;align-items:center;gap:4px}
.more svg{width:14px;height:14px}
.homes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.h{padding:13px 16px;display:flex;align-items:center;gap:13px;height:73px}
.h .lg{width:36px;height:36px;border-radius:10px}
.h .lg svg{width:20px;height:20px;color:var(--ink2)}
.h b{display:block;font:600 21px var(--font-sans);letter-spacing:-.01em}
.h span{font:400 14px var(--font-sans);color:var(--mut)}
.tap{position:absolute;inset:-6px;border:2px solid var(--brand);border-radius:22px;pointer-events:none}
.finger{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(241,235,227,.18);border:2px solid rgba(241,235,227,.5)}

/* NEW: a server's own screen, the This Whombat panel's language at full size */
.page{position:absolute;inset:0;padding:26px 36px 28px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:center;gap:14px;flex:none;height:44px}
.back{width:44px;height:44px;border-radius:12px;background:var(--sf);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.ph .lg{width:40px;height:40px;border-radius:10px}
.ph .lg .mk{width:24px;height:24px}
.ph .who b{font:500 24px var(--font-mono);display:block;line-height:1.1}
.ph .who span{font:400 14px var(--font-sans);color:var(--mut)}
.ph .sp{flex:1}
.ph .chip{display:flex;align-items:center;gap:7px;font:400 14px var(--font-sans);color:var(--ink2)}
.ph .chip svg{width:18px;height:18px;color:var(--mut)}
.ph .sep{width:1px;height:16px;background:var(--line2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.fig{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 18px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.fig .k{font:500 11.5px var(--font-mono);letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.fig .row2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fig .n{font:400 14px var(--font-sans);color:var(--ink2);white-space:nowrap}
.fig .v{font:700 40px/1 var(--font-sans);letter-spacing:-.03em;margin-top:4px}
.fig .v small{font:500 18px var(--font-sans);letter-spacing:0;color:var(--mut);margin-left:3px}
.kpis .seg{margin-top:8px}
.kpis .seg i{height:10px;border-radius:2px}
.mid{display:grid;grid-template-columns:1fr 380px;gap:14px;flex:1;min-height:0}
.duo{display:flex;gap:40px;align-items:flex-end}
.duo .key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;position:relative;top:-1px}
.range{margin-left:auto;display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.range b{font:500 13px var(--font-mono);color:var(--mut);padding:0 14px;height:36px;display:grid;place-items:center;border-radius:9px}
.range b.on{background:var(--sf2);color:var(--ink)}
.chart{flex:1;min-height:0;position:relative;margin-top:8px}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.chart .gl{position:absolute;right:0;font:400 11.5px var(--font-mono);color:var(--mut);transform:translateY(-50%);background:var(--sf);padding-left:6px}
.foot{font:400 12.5px var(--font-mono);color:var(--mut);display:flex;justify-content:space-between;gap:12px}
.side{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}
.vol{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline;margin-top:6px}
.vol b{font:500 14px var(--font-mono)}
.vol span{font:400 13px var(--font-sans);color:var(--mut);text-align:right}
.vol .seg{grid-column:1/-1;margin-bottom:6px}
.vol .seg i{height:8px}
.guests{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.g{display:grid;grid-template-columns:10px 1fr 54px 64px;gap:10px;align-items:center;font:400 14px var(--font-sans)}
.g b{font:500 14px var(--font-mono);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g span{font:400 13px var(--font-mono);color:var(--mut);text-align:right}
.g .dot{width:8px;height:8px}
.pf{display:flex;align-items:center;gap:16px;flex:none;height:48px}
.pf .net{display:flex;align-items:center;gap:8px;font:400 15px var(--font-sans);color:var(--ink2)}
.pf .net svg{width:18px;height:18px;color:var(--mut)}
.dots{display:flex;gap:7px;margin:0 auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sf2)}
.dots i.on{background:var(--ink2)}
.ask{height:48px;padding:0 20px 0 16px;border-radius:14px;background:var(--brand);color:#1c1815;display:flex;align-items:center;gap:9px;font:600 16px var(--font-sans)}
.ask svg{width:19px;height:19px}
</style>
</head>
<body>
<div class="shot">
  <div class="caption">1 · The glance, locked: three server cards a row, CPU · MEM · DISK on their own lines</div>
  <div class="z13"><div class="screen" data-theme="dark"><div class="glance" id="g1"></div></div></div>
</div>
<div class="shot">
  <div class="caption">2 · Touch pve-01: its own screen (view only; Ask opens Talk about this server after the PIN)</div>
  <div class="z13"><div class="screen" data-theme="dark"><div class="page" id="p1"></div></div></div>
</div>
<script src="marks.js"></script>
<script>
const IMG = '../desk-display/img/';
const mark = (name, color) => `<i class="mk" style="--m:url(${MARKS[name]});--c:${color}"></i>`;
const seg = (v, tone, n = 20, max = 100) => '<div class="seg ' + tone + '">' + Array.from({length: n}, (_, i) => '<i' + (i < Math.round(Math.min(v, max) / max * n) ? ' class="on"' : '') + '></i>').join('') + '</div>';
const tone = (v, w, b) => v >= b ? 'bad' : v >= w ? 'warn' : 'ok';
const lock = '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const plug = '<svg class="i" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/></svg>';
const chev = '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const topbar = `<div class="top"><img src="${IMG}whombat-symbol-paper.svg" alt=""><b>Cybex BV</b><div class="sp"></div>
  <div class="chip">${plug}Plugged in · battery kept at 80 %</div><div class="sep"></div><div class="chip">${lock}Locked · touch to use</div></div>`;

const card = (s) => `<div class="card s ${s.cls || ''}">
  <div class="nm"><div class="lg">${s.logo}</div><b>${s.name}</b><span>${s.note}</span></div>
  <div class="bars">
    ${[['CPU', s.cpu, 85, 95], ['MEM', s.mem, 85, 95], ['DISK', s.disk, 85, 95]].map(([k, v, w, b]) =>
      `<div class="bar"><span class="k">${k}</span>${seg(v, tone(v, w, b))}<span class="v">${v} %</span></div>`).join('')}
  </div>${s.tap ? '<div class="tap"></div>' : ''}</div>`;

const servers = [
  {name: 'This Whombat', logo: `<img src="${IMG}whombat-symbol-paper.svg" alt="">`, note: 'up 2 h 14 min', cpu: 7, mem: 18, disk: 13, cls: 'self'},
  {name: 'pve-01', logo: mark('proxmox', '#E57000'), note: 'up 41 d', cpu: 18, mem: 54, disk: 33, tap: true},
  {name: 'pve-02', logo: mark('proxmox', '#E57000'), note: 'up 41 d', cpu: 12, mem: 61, disk: 47},
  {name: 'the-falcon', logo: mark('linux', 'var(--ink2)'), note: 'updating', cpu: 63, mem: 48, disk: 71, cls: 'warn'},
  {name: 'nas', logo: mark('unraid', '#F15A2C'), note: 'up 120 d', cpu: 4, mem: 38, disk: 88},
  {name: 'pi-hole', logo: mark('linux', 'var(--ink2)'), note: 'up 3 d', cpu: 2, mem: 22, disk: 9},
];
const tiles = [
  ['<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>', '21.4 °C', 'Living room'],
  ['<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', 'Heating', 'Heat pump · water 38 °C'],
  ['<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', '3.2 kW', 'Solar now · 14.6 kWh today'],
  ['<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 'Locked', 'Front door'],
];
document.getElementById('g1').innerHTML = `${topbar}
<div class="hero">
  <div><div class="clock">14:34<small>Wednesday 21 October</small></div>
    <div class="say"><img src="${IMG}operator-head.svg" alt="Dusty"><p>2 things need you.</p></div></div>
  <div class="card needs"><div class="hd"><span class="label">Needs you</span><span class="n">2</span></div>
    <div class="unlock">${lock}Touch to answer</div></div>
</div>
<div class="srv">${servers.map(card).join('')}</div>
<div class="more"><span>+2 more${chev}</span></div>
<div class="homes">${tiles.map(([p, v, l]) => `<div class="card h"><div class="lg"><svg class="i" viewBox="0 0 24 24">${p}</svg></div><div><b>${v}</b><span>${l}</span></div></div>`).join('')}</div>`;

// 24 h in 30-minute points (HostServer.cpu24h has 48)
const rnd = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const series = (base, wob, seed, bump = []) => { const r = rnd(seed); return Array.from({length: 48}, (_, i) => Math.max(1, base + (r() - 0.5) * wob + (bump.includes(i) ? wob * 2.2 : 0))); };
const chart = (sets, top, id) => {
  const w = 600, h = 200;
  const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + (i * w / (pts.length - 1)).toFixed(1) + ' ' + (h - (p / top) * h).toFixed(1)).join(' ');
  const grid = [0.25, 0.5, 0.75, 1].map(f => `<line x1="0" x2="${w}" y1="${h - f * h}" y2="${h - f * h}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const lines = sets.map(([pts, color], k) => `<defs><linearGradient id="${id}${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`
    + `<path d="${path(pts)} L${w} ${h} L0 ${h} Z" fill="url(#${id}${k})"/><path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}${lines}</svg><span class="gl" style="top:0">${top} %</span><span class="gl" style="top:50%">${top / 2} %</span></div>`;
};
const kpi = (k, note, v, unit, val, t, max = 100) => `<div class="fig"><div class="row2"><span class="k">${k}</span><span class="n">${note}</span></div>
  <div class="v">${v}<small>${unit}</small></div>${seg(val, t, 24, max)}</div>`;
const guests = [['ok', 'plex', 'VM', '22 %', '6.1 GB'], ['ok', 'home-assistant', 'VM', '9 %', '3.8 GB'], ['ok', 'nextcloud', 'CT', '6 %', '2.2 GB'], ['ok', 'unifi', 'CT', '3 %', '1.4 GB'], ['', 'win11-test', 'VM', 'off', '']];
const vols = [['local-zfs', 'nvme mirror', 41], ['nas-backup', 'on nas', 72], ['local', 'boot disk', 18]];

document.getElementById('p1').innerHTML = `
<div class="ph"><div class="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>
  <div class="lg">${mark('proxmox', '#E57000')}</div>
  <div class="who"><b>pve-01</b><span>Proxmox VE 9.0.10 · 16 cores · up 41 d</span></div><div class="sp"></div>
  <div class="chip"><i class="dot ok"></i>All fine</div><div class="sep"></div><div class="chip">${lock}Locked · touch to use</div></div>
<div class="kpis">
  ${kpi('CPU', 'load 2.9', 18, '%', 18, 'ok')}
  ${kpi('Memory', 'of 128 GB', 69, 'GB', 54, 'ok')}
  ${kpi('Disk', '1.2 of 3.6 TB', 33, '%', 33, 'ok')}
  ${kpi('Temperature', 'cool · limit 85°', 46, '°C', 46, 'ok', 90)}
</div>
<div class="mid">
  <div class="fig"><div class="duo">
      <div><span class="k">Last 24 hours</span></div>
      <span class="n"><i class="key" style="background:var(--ok)"></i>CPU · peak 61 % at 03:10</span>
      <span class="n"><i class="key" style="background:var(--brand)"></i>Memory · avg 52 %</span>
      <div class="range"><b>1 h</b><b class="on">24 h</b><b>7 d</b></div></div>
    ${chart([[series(16, 10, 23, [6, 7, 30]), 'var(--ok)'], [series(53, 3, 9), 'var(--brand)']], 100, 'c1')}
    <div class="foot"><span>yesterday 14:30</span><span>06:00</span><span>12:00</span><span>now</span></div></div>
  <div class="side">
    <div class="fig"><span class="k">Storage</span><div class="vol">${vols.map(([n, d, p]) => `<b>${n}</b><span>${d} · ${p} %</span>${seg(p, tone(p, 85, 95), 30)}`).join('')}</div></div>
    <div class="fig"><div class="row2"><span class="k">Guests</span><span class="n">4 running · 1 off</span></div>
      <div class="guests">${guests.map(([t, n, k, c, m]) => `<div class="g"><i class="dot ${t}" style="${t ? '' : 'background:var(--sf2)'}"></i><b>${n}</b><span>${c}</span><span>${m}</span></div>`).join('')}</div></div>
  </div>
</div>
<div class="pf">
  <div class="net"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-4-4M7 20l4-4M17 20V4M17 4l-4 4M17 4l4 4"/></svg>Network ↓ 24 MB/s · ↑ 3.1 MB/s</div>
  <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ask"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Ask Dusty about pve-01</div>
</div>`;
</script>
</body>
</html>
