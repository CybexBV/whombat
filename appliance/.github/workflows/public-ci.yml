# The public check of every pull request and of `main`, on GitHub's own runners only: the Go tests (with `jq` and
# `dbus-daemon`, which some need), the harness's and the console's checks, the vendored contracts' checksums and a
# secret scan of the new commits. No secrets, read-only token, never `pull_request_target`. The NixOS builds and VM
# tests need far more than a hosted runner: the maintainers run them in their own CI (ci/platform/).
name: public-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq dbus-daemon
      - name: gofmt
        run: out=$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/')); [ -z "$out" ] || { echo "gofmt needed:"; echo "$out"; exit 1; }
      - run: go vet ./... && go test ./...
      - name: The separate Go modules
        run: |
          for m in third_party/whombat-contracts-go nix/packages/standins nix/packages/hosts/manifest-check; do
            (cd "$m" && go vet ./... && go test ./...)
          done
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm contracts:verify && pnpm check
        working-directory: harness
      - run: python3 -I -m unittest discover -s scripts/ci -p 'test_scanner_allowlists.py'
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm check
        working-directory: console/ui
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks and trufflehog at pinned versions
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum -c -
          curl -fsSL -o trufflehog.tgz https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.7/trufflehog_3.99.7_linux_amd64.tar.gz
          echo 'bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef  trufflehog.tgz' | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks && tar -xzf trufflehog.tgz -C bin trufflehog
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The commits this pull request or push adds; all of history when there is no earlier commit.
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}"; then
            range="$BASE..$HEAD"; since=(--since-commit "$BASE")
          else
            range="$HEAD"; since=()
          fi
          gitleaks git . --config .gitleaks.toml --log-opts="$range" --no-banner --redact --exit-code 1
          trufflehog git file://. "${since[@]}" --branch "$HEAD" --no-verification --no-update --fail \
            --exclude-paths=.trufflehog-exclude.txt
