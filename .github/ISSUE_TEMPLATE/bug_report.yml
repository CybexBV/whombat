name: Something doesn't work
description: Report a bug in Whombat, its apps or this repository.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. A security or privacy problem never goes here: see [SECURITY.md](https://github.com/CybexBV/whombat/blob/main/SECURITY.md).
        Leave out anything private (addresses, names, tokens): use made-up values where you need an example.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open …
        2. Ask Dusty …
        3. See …
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - A Whombat installed from the ISO
        - A community box built from this source
        - The web app
        - The Android app
        - The iPhone app
        - A server's agent (hosts)
        - Building or testing this repository
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → This Whombat → About shows the version; or the commit you built from.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, logs or what you already tried.
