name: An idea
description: Suggest something Whombat could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like
      description: What you want to do, and why. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you do now without it, if anything.
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I'd like to build this myself (open the issue first, so we agree on the approach)
